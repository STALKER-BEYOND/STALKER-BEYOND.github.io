<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stalker Beyond Wiki — Lore</title>
  <meta name="description" content="Lore for Stalker Beyond.">
  <!-- Fonts: Oswald for headings, Rubik for body (matches STALKER 2 UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{ --bg-1:#060605; --bg-2:#0d0b07; --panel:#0b0a08; --panel-2:#15120f; --accent:#e3a85a; --accent-soft:#f3c679; --muted:#a0865a; --line:rgba(227,168,90,0.12); --shadow:rgba(0,0,0,0.5); --maxw:980px; }
    *{box-sizing:border-box} html,body{height:100%;margin:0}
    body{font-family:'Rubik', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;background: radial-gradient(circle at top left, rgba(134,95,52,0.08), transparent 18%), linear-gradient(180deg, var(--bg-1), var(--bg-2));color:var(--accent-soft);padding:24px;line-height:1.45}
    .wrap{max-width:var(--maxw);margin:0 auto;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02));border-radius:10px;padding:14px;border:1px solid var(--line);box-shadow:0 10px 40px var(--shadow)}
    .titlebar{background:linear-gradient(180deg,var(--panel),var(--panel-2));padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.02);display:flex;align-items:center}
    .titlebar h1{margin:0;color:var(--accent-soft);font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;font-size:20px;text-shadow:0 0 8px rgba(227,168,90,0.12)}
    nav{display:flex;gap:10px;margin-top:12px}
    nav a{font-family:'Oswald',sans-serif;color:var(--accent);text-decoration:none;padding:6px 8px;border-radius:6px;font-weight:600;font-size:12px;letter-spacing:0.08em;text-transform:uppercase}
    nav a:hover{background:rgba(255,255,255,0.02);border:1px solid var(--line)}
    main{margin-top:16px}
    .card{background:transparent;padding:16px;border-radius:8px}
    .card h2{font-family:'Oswald',sans-serif;margin:0 0 8px 0;color:var(--accent-soft);letter-spacing:0.08em;text-transform:uppercase}
    .card p{margin:0;color:var(--muted)}
    footer{margin-top:18px;color:var(--muted);font-size:12px}
    @media (max-width:600px){body{padding:12px}.wrap{padding:12px}.titlebar h1{font-size:18px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="titlebar">
      <h1>LORE</h1>
    </div>

    <nav aria-label="Main navigation">
      <a href="../home/">Home</a>
      <a href="../rules/">Rules</a>
      <a href="./">Lore</a>
      <a href="../warfare/">Warfare</a>
      <a href="../faq/">FAQ</a>
    </nav>

    <main>
      <section class="card">
        <h2>Setting & Factions</h2>
        <p>Use this space for timelines, faction notes, artifacts, and canon rules for storytelling. Start with a setting overview and add pages for factions or timelines as needed.</p>
      </section>
    </main>

    <footer>v0.1 — Stalker Beyond Wiki</footer>
  </div>
</body>
</html>
