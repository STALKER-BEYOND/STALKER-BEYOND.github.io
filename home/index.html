<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stalker Beyond Wiki — Home</title>
  <meta name="description" content="Stalker Beyond — rules, lore, and community documentation.">
  <!-- Social: Oswald & Rubik -->
  <meta property="og:site_name" content="STALKER BEYOND">
  <meta property="og:title" content="STALKER BEYOND WIKI — HOME">
  <meta property="og:description" content="Stalker Beyond — rules, lore, and community documentation.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://stalker-beyond.github.io/wiki/home/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="STALKER BEYOND WIKI — HOME">
  <meta name="twitter:description" content="Stalker Beyond — rules, lore, and community documentation.">
  <meta name="version" content="V0.1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050403;
      --panel:#0b0a08; --panel-2:#15120f;
      --accent:#e3a85a; --accent-soft:#f3c679; --muted:#9b7f53;
      --line:rgba(227,168,90,0.10);
      --shadow-wrap: rgba(0,0,0,0.18);
      --maxw:1100px;
      --wrap-radius:12px;
      --card-radius:10px;
      --wrap-padding:28px;
    }
    *{box-sizing:border-box}
    /* Flat page background to avoid banding */
    html,body{height:100%;margin:0;background:var(--bg);color:var(--accent-soft);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif}

    .stage{min-height:100vh;padding:32px 28px;display:flex;align-items:flex-start;justify-content:center}

    /* Wrap: use overflow hidden and a single radius so corner accents are symmetrical */
    .wrap{width:100%;max-width:var(--maxw);min-height:calc(100vh - 96px);background:rgba(255,255,255,0.012);border-radius:var(--wrap-radius);padding:var(--wrap-padding);border:1px solid var(--line);box-shadow:0 6px 20px var(--shadow-wrap);display:flex;flex-direction:column;gap:18px;overflow:hidden;position:relative}

    /* Titlebar: no independent radius so it aligns perfectly with wrap corners */
    .titlebar{background:linear-gradient(180deg,var(--panel),var(--panel-2));padding:14px;border-radius:0;border-bottom:1px solid rgba(255,255,255,0.02);display:flex;flex-direction:column;gap:6px}
    .crumbs{color:var(--muted);font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:0.08em;text-transform:uppercase}
    .titlebar h1{margin:0;color:var(--accent-soft);font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;font-size:22px;text-shadow:0 0 6px rgba(227,168,90,0.06)}

    nav{display:flex;gap:12px;margin-top:6px}
    nav a{display:inline-block;font-family:'Oswald',sans-serif;color:var(--accent);text-decoration:none;padding:8px 10px;border-radius:6px;font-weight:600;font-size:13px;letter-spacing:0.08em;text-transform:uppercase}
    nav a:hover{background:rgba(255,255,255,0.02);box-shadow:0 6px 12px rgba(227,168,90,0.06);transform:translateY(-2px)}
    nav a:focus{outline:none;box-shadow:0 0 0 4px rgba(227,168,90,0.06)}

    main{display:flex;flex:1;gap:18px}
    .leftcol{flex:1;display:flex;flex-direction:column;gap:18px}
    .rightcol{width:320px;min-width:260px}

    /* Cards: consistent radius and borders for symmetrical LED-like appearance */
    .card{background:rgba(255,255,255,0.012);border-radius:var(--card-radius);padding:20px;min-height:50vh;border:1px solid rgba(255,255,255,0.015);box-shadow:inset 0 1px 0 rgba(255,255,255,0.02)}
    .card.empty{display:flex;align-items:center;justify-content:center;color:rgba(227,168,90,0.08);font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:0.12em}

    /* Ensure internal edges are aligned with the wrap when near corners */
    .leftcol > .card:first-child{margin-top:0}

    footer{margin-top:6px;color:var(--muted);font-size:13px}

    @media (max-width:980px){.rightcol{display:none}.wrap{padding:18px}.card{min-height:50vh}}
    @media (max-width:600px){.stage{padding:16px}.titlebar h1{font-size:20px}.nav a{font-size:11px}}
  </style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <div class="titlebar">
        <div class="crumbs">S.T.A.L.K.E.R. BEYOND WIKI / THE PAGE</div>
        <h1>Home</h1>
      </div>

      <nav aria-label="Main navigation">
        <a href="./">Home</a>
        <a href="../rules/">Rules</a>
        <a href="../lore/">Lore</a>
        <a href="../warfare/">Warfare</a>
        <a href="../faq/">FAQ</a>
      </nav>

      <main>
        <div class="leftcol">
          <section class="card empty" aria-label="main-content"></section>
          <section class="card empty" aria-label="secondary-content"></section>
        </div>
        <aside class="rightcol">
          <section class="card empty" aria-label="sidebar"></section>
        </aside>
      </main>

      <footer>V0.1 — STALKER BEYOND WIKI</footer>
    </div>
  </div>
</body>
</html>
